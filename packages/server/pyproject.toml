[project]
name = "pi-server"
version = "0.53.0"
description = "Experimental server package for pi — Python mirror of @earendil-works/pi-server"
requires-python = ">=3.11"
dependencies = [
    "pi-ai",
    "pi-protocol",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_server"]

[tool.uv.sources]
pi-ai = { workspace = true }
pi-protocol = { workspace = true }
