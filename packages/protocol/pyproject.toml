[project]
name = "pi-protocol"
version = "0.53.0"
description = "Transport-neutral CBOR protocol — Python mirror of @earendil-works/pi-protocol"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_protocol"]
